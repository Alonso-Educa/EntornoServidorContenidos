<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validación de formulario</title>
</head>

<body>
    <form action="validacion_formulario.php" method="post" enctype="multipart/form-data">
        <label for="nom">Nombre del alumno: </label>
        <input type="text" id="nom" name="nom"><br>

        <label for="ab">Alfababético: </label>
        <input type="text" id="ab" name="ab"><br>

        <label for="ab_o">Alfababético Opcional: </label>
        <input type="text" id="ab_o" name="ab_o"><br>

        <label for="an">Alfanumérico: </label>
        <input type="text" id="an" name="an"><br>

        <label for="an_o">Alfanumérico Opcional: </label>
        <input type="text" id="an_o" name="an_o"><br>

        <label for="fec">Fecha: </label>
        <input type="date" id="fec" name="fec"><br>

        <label for="fec_o">Fecha Opcional: </label>
        <input type="date" id="fec_o" name="fec_o"><br>

        <label>Radio obligatorio: </label>
        <input id="o1" name="rad" type="radio" value="Opcion1" checked> <label for="o1">Opcion1</label>
        <input id="o2" name="rad" type="radio" value="Opcion2"> <label for="o2">Opcion2</label>
        <input id="o3" name="rad" type="radio" value="Opcion3"> <label for="o3">Opcion3</label><br>

        <label for="sel">Elige una opción: </label>
        <select id="sel" name="sel">
            <option>Seleccione</option>
            <option>Sel1</option>
            <option>Sel2</option>
            <option>Sel3</option>
        </select><br>

        <label for="che">Elige al menos 1 y máximo 3: </label><br>
        <input type="checkbox" id="che1" name="che[]" value="Check1">
        <label for="che1">Check1</label>
        <input type="checkbox" id="che2" name="che[]" value="Check2">
        <label for="che2">Check2</label>
        <input type="checkbox" id="che3" name="che[]" value="Check3">
        <label for="che3">Check3</label>
        <input type="checkbox" id="che4" name="che[]" value="Check4">
        <label for="che4">Check4</label>
        <input type="checkbox" id="che5" name="che[]" value="Check5">
        <label for="che5">Check5</label><br>

        <label for="tel">Nº Teléfono: </label>
        <input type="tel" id="tel" name="tel"><br>

        <label for="ema">Email: </label>
        <input type="email" id="ema" name="ema"><br>

        <label for="con">Contraseña: </label>
        <input type="password" id="con" name="con"><br>

        <label for="doc">Subir documento: </label>
        <input type="file" id="doc" name="doc"><br>

        <button type="submit">Enviar</button>
    </form>
</body>

</html>
